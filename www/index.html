<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass Saver - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Pass saver</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar categoría o site...">
        </header>

        <div class="actions">
            <button id="btnAddCategory" class="btn btn-blue">Add category</button>
            <button id="btnAddSite" class="btn btn-default" style="background:#e0e0e0; color:#333;">Add site</button>
        </div>

        <div class="main-layout">
            <div class="sidebar">
                <h3>Categories</h3>
                <ul id="categoriesList" class="cat-list">
                    </ul>
            </div>

            <div class="content">
                <table id="sitesTable">
                    <thead>
                        <tr>
                            <th>Sitio</th>
                            <th>User</th>
                            <th>Created at</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="sitesBody">
                        <tr><td colspan="4" style="text-align:center; color:#666;">Selecciona una categoría para ver sus contraseñas</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Título del Modal</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage">Mensaje del modal...</p>
                <input type="text" id="modalInput" style="display:none;" placeholder="Escribe aquí...">
            </div>
            <div class="modal-footer">
                <button id="modalCancelBtn" class="btn btn-red">Cancelar</button>
                <button id="modalOkBtn" class="btn btn-blue">Aceptar</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/index.js"></script>
</body>
</html>
